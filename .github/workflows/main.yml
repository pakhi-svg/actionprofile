name: Vprofile CICD Workflow

on:
  push:
    branches: [ "main", "develop" ]

  pull_request:
    branches: [ "main", "develop" ]

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"   # nightly run at 2 AM UTC

permissions:
  contents: read


jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

        run: mvn install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if build fails
        if: failure()
        run: echo "Build failed!"




  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: run test on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "skipping"


  Security-Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run security scan on main branch
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: .
          format: json
          exit-code: 0
          vuln-type: os,library
          output: trivy-report.json

      - name: upload trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report  
          path: trivy-report.json
        if: github.ref != 'refs/heads/main'
        run: echo "skipping"